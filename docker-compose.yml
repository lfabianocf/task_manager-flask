services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      # Apontar para a raiz (/app) permite que o Python encontre qualquer subpasta
      - PYTHONPATH=/app
    # Execução baseada na estrutura que vimos no seu comando tree
    command: python todo_project/todo_project/run.py