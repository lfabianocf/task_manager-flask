services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    # Este comando vai listar os arquivos e depois falhar, 
    # permitindo que vejamos a estrutura real no log do GitHub.
    command: /bin/sh -c "ls -R /app && python todo_project/run.py"