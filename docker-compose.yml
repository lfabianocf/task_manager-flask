services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app:/app/todo_project

  # 🌟 O ELO QUE FALTAVA: Prometheus para coletar as métricas do Flask
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Senha padrão para testes
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage:
