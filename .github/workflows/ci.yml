name: CI-CD Production Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ==========================================
  # 🔐 1. SECURITY ANALYSIS (Static & Audit)
  # ==========================================
  security-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Instalar dependências de segurança
        run: |
          pip install --upgrade pip
          pip install bandit pip-audit

      - name: 🔐 Bandit (SAST)
        run: |
          bandit -r . -ll -ii -s B104

      - name: 🔐 pip-audit (dependências)
        run: |
          pip-audit

  # ==========================================
  # 🐳🚀🛡️ 2. BUILD, TEST & DAST (Ambiente Isolado)
  # ==========================================
  build-and-test:
    needs: security-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Builda e já sobe usando o Docker Compose no mesmo ambiente
      - name: Subir aplicação com Docker Compose
        run: |
          docker compose up -d --build

      - name: Debug - Listar containers e Logs se falhar
        if: always()
        run: |
          docker ps -a
          docker compose logs web

      - name: Healthcheck Flask
        run: |
          echo "Waiting for app..."
          for i in {1..30}; do
            if curl -s http://localhost:5000; then
              echo "App is UP"
              exit 0
            fi
            echo "attempt $i..."
            sleep 2
          done
          
          echo "=================================================="
          echo "🚨 APLICAÇÃO FALHOU! EXIBINDO LOGS DO CONTAINER: 🚨"
          echo "=================================================="
          docker compose logs web
          exit 1

      # Como a aplicação está UP nesta máquina, o DAST agora vai funcionar!
      - name: Rodar OWASP ZAP (DAST)
        run: |
          docker run --network host -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:5000 -g gen.conf \
            -r zap-report.html \
            -J zap-report.json || true