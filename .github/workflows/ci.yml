name: CI-CD Production Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # =========================
  # 🧪 1. TESTS
  # =========================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Configuração correta do Cache para acelerar os próximos deploys
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Instalação das dependências fora do bloco de configuração do cache
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/todo_project
        run: |
          python -m pytest tests/ -v

  # =========================
  # 🐳 2. BUILD (DOCKER)
  # =========================
  build:
    needs: test # O build só começa se o job 'test' terminar com sucesso
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t task-manager:${{ github.sha }} .

  # =========================
  # 🔐 3. SECURITY ANALYSIS
  # =========================
  security-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Instalar dependências de segurança
        run: |
          pip install --upgrade pip
          pip install bandit pip-audit

      - name: 🔐 Bandit (SAST)
        run: |
          bandit -r . -ll -ii -s B104

      - name: 🔐 pip-audit (dependências)
        run: |
          pip-audit

      - name: 🔐 OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "task_manager"
          path: "."
          format: "HTML"
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload relatório OWASP
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # =========================
  # 🛡️ 4. DAST - OWASP ZAP
  # =========================
  dast-zap:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1. Sobe o app na MESMA máquina onde o ZAP vai rodar
      - name: Subir aplicação com Docker Compose
        run: |
          docker compose up -d --build

      # 2. Aguarda o Flask inicializar completamente (Healthcheck interno)
      - name: Healthcheck Flask
        run: |
          echo "Waiting for app..."
          for i in {1..30}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "App is UP on localhost:5000!"
              exit 0
            fi
            echo "attempt $i..."
            sleep 2
          done
          echo "App failed to start"
          docker compose logs web
          exit 1

      # 3. Agora o ZAP consegue achar o localhost:5000 com permissão de escrita!
      - name: OWASP ZAP scan
        run: |
          # 🌟 ADICIONADO: --user root para o Linux permitir a gravação do relatório
          # 🌟 AJUSTADO: -r zap-report.html (o ZAP joga direto no seu $(pwd) através do volume)
          docker run --rm --user root --network host -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:5000 \
            -r zap-report.html \
            -J zap-report.json \
            -X zap-report.xml || true

      # 4. Remove os containers para limpar a máquina após o teste
      - name: Stop containers
        if: always()
        run: docker compose down

      # 5. Salva o relatório gerado para você baixar na aba Actions
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports-triade
          path: ./zap-report.* # 🌟 GARANTIDO: Busca o arquivo na raiz do workspace
