name: CI-CD Production Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # =========================
  # 🔐 1. SECURITY ANALYSIS
  # =========================
  security-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Instalar dependências de segurança
        run: |
          pip install --upgrade pip
          pip install bandit pip-audit

      - name: 🔐 Bandit (SAST)
        run: |
          bandit -r . -ll -ii -s B104

      - name: 🔐 pip-audit (dependências)
        run: |
          pip-audit

      - name: 🔐 OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "task_manager"
          path: "."
          format: "HTML"
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload relatório OWASP
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # =========================
  # 🐳 2. BUILD (DOCKER)
  # =========================
  build:
    needs: security-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t task-manager:${{ github.sha }} .

  # =========================
  # 🚀 3. START APP (TEST ENV)
  # =========================
  start-app:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir aplicação com Docker Compose
        run: |
          docker compose up -d
          echo "Waiting app startup..."
          sleep 15

      - name: Healthcheck Flask
        run: |
          curl --fail http://localhost:5000 || exit 1

  # =========================
  # 🛡️ 4. DAST - OWASP ZAP
  # =========================
  dast-zap:
    needs: start-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Healthcheck app
        run: |
          curl --fail http://localhost:5000

      - name: OWASP ZAP scan
        run: |
          docker run --network host -v $(pwd):/zap/wrk/:rw \
          owasp/zap2docker-stable zap-baseline.py \
          -t http://localhost:5000 \
          -r zap-report.html || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
